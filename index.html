<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAD Golf Pool 2026</title>
    <style>
        :root {
            --green-dark : #145214;
            --green      : #1b5e20;
            --green-mid  : #2e7d32;
            --green-light: #388e3c;
            --accent     : #f9a825;
            --accent-dim : #fdd835;
            --surface    : #ffffff;
            --bg         : #f1f8e9;
            --border     : #c8e6c9;
            --text       : #212121;
            --muted      : #757575;
            --shadow     : 0 2px 10px rgba(0,0,0,0.10);
            --radius     : 10px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-size: 15px;
            line-height: 1.5;
        }

        /* ─── HEADER ─── */
        header {
            background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 100%);
            color: #fff;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 3px 8px rgba(0,0,0,0.35);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .hdr-icon { font-size: 2.2rem; flex-shrink: 0; }
        .hdr-text h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.2px; }
        .hdr-text p  { font-size: 0.76rem; opacity: 0.78; margin-top: 2px; }
        .hdr-right {
            margin-left: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        #last-updated { font-size: 0.7rem; opacity: 0.72; }
        .btn-refresh {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 3px 10px;
            border-radius: 5px;
            font-size: 0.72rem;
            cursor: pointer;
            transition: background 0.18s;
        }
        .btn-refresh:hover { background: rgba(255,255,255,0.28); }

        /* ─── NAV ─── */
        nav {
            background: var(--green-light);
            display: flex;
            overflow-x: auto;
            scrollbar-width: none;
        }
        nav::-webkit-scrollbar { display: none; }
        .tab-btn {
            color: rgba(255,255,255,0.72);
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            padding: 0.7rem 1.15rem;
            font-size: 0.86rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }
        .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .tab-btn.active { color: #fff; border-bottom-color: var(--accent); }

        /* ─── LAYOUT ─── */
        main { max-width: 1100px; margin: 0 auto; padding: 1.4rem 1rem; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* ─── STAT STRIP ─── */
        .stat-strip {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.9rem;
            margin-bottom: 1.4rem;
        }
        .stat-box {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 0.9rem 1rem;
            text-align: center;
            border-top: 4px solid var(--green);
        }
        .stat-box.gold { border-top-color: var(--accent); }
        .stat-box .val { font-size: 1.6rem; font-weight: 700; color: var(--green); line-height: 1.1; }
        .stat-box.gold .val { color: #c77700; }
        .stat-box .lbl { font-size: 0.7rem; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* ─── CARD ─── */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 1.4rem;
        }
        .card-hdr {
            background: var(--green);
            color: #fff;
            padding: 0.65rem 1rem;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .card-body { padding: 0; }

        /* ─── TABLES ─── */
        .tbl-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.86rem;
        }
        thead th {
            background: #e8f5e9;
            color: var(--green-dark);
            font-weight: 700;
            padding: 0.6rem 0.85rem;
            text-align: left;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
            position: sticky;
            top: 0;
        }
        tbody td {
            padding: 0.52rem 0.85rem;
            border-bottom: 1px solid #e8f5e9;
            vertical-align: middle;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: #f9fbe7; }

        /* column helpers */
        .c-ctr   { text-align: center; }
        .c-right { text-align: right; }
        .c-name  { font-weight: 600; }
        .c-total { text-align: right; font-weight: 700; color: var(--green-dark); }
        .c-rank  { text-align: center; width: 44px; font-weight: 700; }

        /* leader row */
        .row-lead td { background: #fffde7 !important; }

        /* money colours */
        .pos  { color: #2e7d32; }
        .zero { color: #bdbdbd; }

        /* rank medals */
        .r1 { color: #c77700; }
        .r2 { color: #757575; }
        .r3 { color: #795548; }

        /* ─── BADGES ─── */
        .badge {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .badge-win   { background: #e8f5e9; color: #1b5e20; }
        .badge-paid  { background: #e3f2fd; color: #0d47a1; }
        .badge-unpaid{ background: #fbe9e7; color: #bf360c; }
        .badge-used  { background: #fafafa; color: #9e9e9e; border: 1px solid #e0e0e0; }

        /* ─── WEEK SELECTOR ─── */
        .sel-row {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            background: #fafff8;
            flex-wrap: wrap;
        }
        .sel-row label { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
        select {
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 0.84rem;
            color: var(--text);
            background: #fff;
        }

        /* ─── RESULT WINNER BANNER ─── */
        .winner-banner {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: linear-gradient(90deg, #e8f5e9, #f9fbe7);
            border-left: 4px solid var(--accent);
            padding: 0.6rem 1rem;
            font-size: 0.88rem;
            margin: 0;
        }
        .winner-banner strong { color: var(--green-dark); }

        /* ─── POOL INFO ─── */
        .info-kv td:first-child { font-weight: 600; color: var(--green-dark); width: 45%; padding-right: 1rem; }
        .payout-row { background: #f9fbe7; }
        .payout-row td:first-child { color: var(--accent); }

        /* ─── LOADING / ERROR ─── */
        .msg { padding: 2.5rem 1rem; text-align: center; color: var(--muted); font-size: 0.88rem; }
        .msg.err { color: #c62828; }
        .msg.err small { display: block; margin-top: 6px; font-size: 0.76rem; color: #e57373; }

        .spinner {
            display: inline-block; width: 17px; height: 17px;
            border: 3px solid var(--border); border-top-color: var(--green);
            border-radius: 50%; animation: spin 0.7s linear infinite;
            margin-right: 7px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── HOW IT WORKS (Pool Info) ─── */
        .how-list { list-style: none; counter-reset: step; }
        .how-list li {
            counter-increment: step;
            padding: 0.6rem 1rem 0.6rem 3rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.87rem;
            position: relative;
        }
        .how-list li:last-child { border-bottom: none; }
        .how-list li::before {
            content: counter(step);
            position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%);
            background: var(--green); color: #fff;
            width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 700;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 600px) {
            .hdr-text h1 { font-size: 1.05rem; }
            main { padding: 1rem 0.4rem; }
            thead th, tbody td { padding: 0.42rem 0.55rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<!-- ════════════════════ HEADER ════════════════════ -->
<header>
    <span class="hdr-icon">⛳</span>
    <div class="hdr-text">
        <h1>OAD Golf Pool 2026</h1>
        <p>One and Done — Weekly Picks Pool · $100 Buy-In</p>
    </div>
    <div class="hdr-right">
        <span id="last-updated"></span>
        <button class="btn-refresh" onclick="refreshAll()">↻ Refresh</button>
    </div>
</header>

<!-- ════════════════════ TABS ════════════════════ -->
<nav>
    <button class="tab-btn active"  onclick="showTab('standings',this)">🏆 Standings</button>
    <button class="tab-btn"         onclick="showTab('picks',this)">🎯 Picks</button>
    <button class="tab-btn"         onclick="showTab('winners',this)">🏅 Weekly Winners</button>
    <button class="tab-btn"         onclick="showTab('info',this)">ℹ️ Pool Info</button>
</nav>

<!-- ════════════════════ MAIN ════════════════════ -->
<main>

    <!-- STANDINGS -->
    <div id="standings" class="tab-pane active">
        <div id="standings-stats" class="stat-strip"></div>
        <div class="card">
            <div class="card-hdr">🏆 Season Standings</div>
            <div class="card-body">
                <div id="standings-body" class="tbl-wrap">
                    <div class="msg"><span class="spinner"></span>Loading standings…</div>
                </div>
            </div>
        </div>
    </div>

    <!-- PICKS -->
    <div id="picks" class="tab-pane">
        <div class="card">
            <div class="card-hdr">🎯 Weekly Picks</div>
            <div class="card-body">
                <div class="sel-row">
                    <label>Tournament week:</label>
                    <select id="week-select" onchange="renderPicksForWeek()"></select>
                </div>
                <div id="winner-banner"></div>
                <div id="picks-body" class="tbl-wrap">
                    <div class="msg"><span class="spinner"></span>Loading picks…</div>
                </div>
            </div>
        </div>
    </div>

    <!-- WEEKLY WINNERS -->
    <div id="winners" class="tab-pane">
        <div id="winners-stats" class="stat-strip"></div>
        <div class="card">
            <div class="card-hdr">🏅 Weekly Winners</div>
            <div class="card-body">
                <div id="winners-body" class="tbl-wrap">
                    <div class="msg"><span class="spinner"></span>Loading weekly winners…</div>
                </div>
            </div>
        </div>
    </div>

    <!-- POOL INFO -->
    <div id="info" class="tab-pane">
        <div id="info-body">
            <div class="msg"><span class="spinner"></span>Loading pool info…</div>
        </div>
    </div>

</main>

<script>
// ═══════════════════════════════════════════════════════════
//  CONFIG
//
//  PUBLISHED_ID  → the long key from your "Publish to web" URL
//                  File → Share → Publish to web → copy the
//                  portion after /spreadsheets/d/e/ and before /pub
//
//  TAB           → must match your sheet tab names exactly
// ═══════════════════════════════════════════════════════════
const PUBLISHED_ID = '2PACX-1vRXSNH78wfa-SFi_Jya-5reMFzbhG8dC6VvSi6OsFp8vnwNurLIsnNBgmB7ICsAtw2aMwQT7RyFCaqO';

const TAB = {
    standings    : 'Standings',
    picks        : 'Picks',
    weeklyWinners: 'Weekly Winners',
    setup        : 'Pool Setup',
};

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
const cache = {};          // raw parsed CSV data per tab key
const loaded = {};         // which tab-panes have been rendered
let   picksRows = null;    // kept for the week selector

// ═══════════════════════════════════════════════════════════
//  FETCH / PARSE
// ═══════════════════════════════════════════════════════════
function csvUrl(tabName) {
    // Uses the "Publish to web" URL — works without any API key
    return `https://docs.google.com/spreadsheets/d/e/${PUBLISHED_ID}/pub?output=csv&sheet=${encodeURIComponent(tabName)}`;
}

function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
        const c = text[i], n = text[i + 1];
        if (inQ) {
            if (c === '"' && n === '"') { field += '"'; i++; }
            else if (c === '"')          { inQ = false; }
            else                         { field += c; }
        } else {
            if      (c === '"')  { inQ = true; }
            else if (c === ',')  { row.push(field.trim()); field = ''; }
            else if (c === '\n') { row.push(field.trim()); if (row.some(Boolean)) rows.push(row); row = []; field = ''; }
            else if (c !== '\r') { field += c; }
        }
    }
    if (field || row.length) { row.push(field.trim()); if (row.some(Boolean)) rows.push(row); }
    return rows;
}

async function fetchTab(key) {
    if (cache[key]) return cache[key];
    const r = await fetch(csvUrl(TAB[key]));
    if (!r.ok) throw new Error(`HTTP ${r.status} loading "${TAB[key]}"`);
    cache[key] = parseCSV(await r.text());
    return cache[key];
}

// ═══════════════════════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════════════════════
function showTab(name, btn) {
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(name).classList.add('active');
    btn.classList.add('active');
    if (!loaded[name]) loadAndRender(name);
}

async function loadAndRender(name) {
    try {
        if (name === 'standings') {
            await Promise.all([fetchTab('standings'), fetchTab('weeklyWinners')]);
            renderStandings();
        }
        if (name === 'picks') {
            await Promise.all([fetchTab('picks'), fetchTab('weeklyWinners')]);
            renderPicks();
        }
        if (name === 'winners') {
            await fetchTab('weeklyWinners');
            renderWeeklyWinners();
        }
        if (name === 'info') {
            await fetchTab('setup');
            renderInfo();
        }
        loaded[name] = true;
    } catch (e) {
        setErr(name, e.message);
    }
}

function setErr(pane, msg) {
    const targets = {
        standings: 'standings-body',
        picks    : 'picks-body',
        winners  : 'winners-body',
        info     : 'info-body',
    };
    const el = document.getElementById(targets[pane]);
    const testUrl = csvUrl(TAB[pane] || 'Standings');

    // Detect file:// protocol — most common cause of failure
    const isLocal = location.protocol === 'file:';

    if (el) el.innerHTML = `<div class="msg err">
        ⚠️ <strong>Could not load data.</strong><br>
        <small style="display:block;margin-top:6px;line-height:1.7">
          Error: <code>${msg}</code>
        </small>
        ${isLocal ? `<div style="margin-top:10px;padding:8px 10px;background:#fff3e0;border-radius:5px;color:#e65100;font-size:0.8rem">
          <strong>⚠️ You are viewing this file locally (file://).</strong><br>
          Browsers block all data fetching from local files.<br>
          You must host this on GitHub Pages (https://) for it to work.
        </div>` : ''}
        <div style="margin-top:10px;font-size:0.78rem;color:#777">
          Test the data URL directly in a new tab:<br>
          <a href="${testUrl}" target="_blank" style="color:#1565c0;word-break:break-all">${testUrl}</a>
        </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════
//  FORMAT HELPERS
// ═══════════════════════════════════════════════════════════
function toNum(v) {
    return parseFloat(String(v || '0').replace(/[$,]/g, '')) || 0;
}
function fmtMoney(v) {
    const n = toNum(v);
    if (n === 0) return '<span class="zero">—</span>';
    return `<span class="pos">$${n.toLocaleString('en-CA', {minimumFractionDigits:2, maximumFractionDigits:2})}</span>`;
}
function fmtTotal(v) {
    const n = toNum(v);
    return `$${n.toLocaleString('en-CA', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
}

// ═══════════════════════════════════════════════════════════
//  STANDINGS
//
//  Expected layout (from your sheet):
//    Row 0  → headers: ["Team / Owner", "Week 1 - Tournament", ..., "Total"]
//    Row 1+ → ["Name (Team N)", $earned, ..., $total]
//
//  The last non-empty header column is treated as "Total".
//  All columns between index 1 and totalIdx are weekly earnings.
// ═══════════════════════════════════════════════════════════
function renderStandings() {
    const rows = (cache.standings || []).filter(r => r[0]);
    if (rows.length < 2) {
        document.getElementById('standings-body').innerHTML = '<div class="msg">No standings data yet.</div>';
        return;
    }

    const headers  = rows[0];
    const body     = rows.slice(1);

    // Find "Total" column — search from right for a cell containing "total"
    let totalIdx = headers.length - 1;
    for (let i = headers.length - 1; i >= 1; i--) {
        if (headers[i] && /total/i.test(headers[i])) { totalIdx = i; break; }
    }

    const weekHeaders = headers.slice(1, totalIdx);

    // Sort descending by total
    body.sort((a, b) => toNum(b[totalIdx]) - toNum(a[totalIdx]));

    // Leader name for stat box
    const leader = body[0] ? body[0][0] : '—';
    const totalPot = body.reduce((s, r) => s + toNum(r[totalIdx]), 0);
    const weeksPlayed = weekHeaders.filter((_, i) => body.some(r => toNum(r[i + 1]) > 0)).length;

    document.getElementById('standings-stats').innerHTML = `
        <div class="stat-box"><div class="val">${body.length}</div><div class="lbl">Teams</div></div>
        <div class="stat-box"><div class="val">${weeksPlayed}</div><div class="lbl">Weeks Played</div></div>
        <div class="stat-box gold"><div class="val">${leader}</div><div class="lbl">Current Leader</div></div>
        <div class="stat-box"><div class="val">$${Math.round(totalPot).toLocaleString()}</div><div class="lbl">Total Paid Out</div></div>
    `;

    let t = '<table><thead><tr>';
    t += '<th class="c-rank">#</th>';
    t += '<th>Team / Owner</th>';
    weekHeaders.forEach(w => t += `<th class="c-right">${w || ''}</th>`);
    t += '<th class="c-right" style="border-left:2px solid #c8e6c9">Total</th>';
    t += '</tr></thead><tbody>';

    body.forEach((row, i) => {
        const rank  = i + 1;
        const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
        const rCls  = rank === 1 ? 'r1' : rank === 2 ? 'r2' : rank === 3 ? 'r3' : '';
        t += `<tr${rank === 1 ? ' class="row-lead"' : ''}>`;
        t += `<td class="c-rank ${rCls}">${medal}</td>`;
        t += `<td class="c-name">${row[0]}</td>`;
        for (let j = 1; j <= weekHeaders.length; j++) {
            t += `<td class="c-right">${fmtMoney(row[j])}</td>`;
        }
        t += `<td class="c-total" style="border-left:2px solid #c8e6c9">${fmtTotal(row[totalIdx])}</td>`;
        t += '</tr>';
    });

    t += '</tbody></table>';
    document.getElementById('standings-body').innerHTML = t;
}

// ═══════════════════════════════════════════════════════════
//  PICKS
//
//  Expected layout:
//    Row 0  → headers: ["Team / Owner", "Week 1 - Tournament", "Week 2 - ...", ...]
//    Row 1+ → ["Team Name", "Golfer Pick", ...]
//
//  The "Weekly Winners" tab supplies the tournament winner for
//  each week so we can show the ✓ Win badge.
// ═══════════════════════════════════════════════════════════
function renderPicks() {
    const rows = (cache.picks || []).filter(r => r[0]);
    if (rows.length < 2) {
        document.getElementById('picks-body').innerHTML = '<div class="msg">No picks entered yet.</div>';
        return;
    }

    picksRows = rows;
    const headers     = rows[0];
    const weekHeaders = headers.slice(1).filter(Boolean);

    // Populate selector
    const sel = document.getElementById('week-select');
    sel.innerHTML = '';
    weekHeaders.forEach((w, i) => {
        const o = document.createElement('option');
        o.value = i;
        o.textContent = w;
        sel.appendChild(o);
    });

    // Default to the latest week with at least one pick
    const bodyRows = rows.slice(1);
    let latestWeek = 0;
    for (let w = 0; w < weekHeaders.length; w++) {
        if (bodyRows.some(r => r[w + 1] && r[w + 1].trim())) latestWeek = w;
    }
    sel.value = latestWeek;

    renderPicksForWeek();
}

function renderPicksForWeek() {
    const sel    = document.getElementById('week-select');
    const wIdx   = parseInt(sel.value);
    const rows   = picksRows;
    if (!rows) return;

    const weekName   = rows[0][wIdx + 1] || `Week ${wIdx + 1}`;
    const bodyRows   = rows.slice(1);

    // ── Find tournament winner from Weekly Winners tab ──
    // Expected Weekly Winners columns (adjust indices if your sheet differs):
    //   Col 0: Week # or label
    //   Col 1: Tournament name
    //   Col 2: Golfer who won the tournament
    //   Col 3: Team owner(s) that picked the winner
    //   Col 4: Prize amount
    let tournamentWinner = null;
    let weeklyWinnerTeam = null;
    if (cache.weeklyWinners) {
        const ww = cache.weeklyWinners.slice(1); // skip header
        ww.forEach(r => {
            const wLabel = String(r[0] || '').trim();
            const tName  = String(r[1] || '').trim();
            // Match by week index+1 or by tournament name substring
            if (wLabel === String(wIdx + 1) ||
                wLabel.toLowerCase().includes(`week ${wIdx + 1}`) ||
                weekName.toLowerCase().includes(tName.toLowerCase()) ||
                tName.toLowerCase().includes(weekName.split('-').pop().trim().toLowerCase())) {
                tournamentWinner = (r[2] || '').trim();
                weeklyWinnerTeam = (r[3] || '').trim();
            }
        });
    }

    // ── Winner banner ──
    const bannerEl = document.getElementById('winner-banner');
    if (tournamentWinner) {
        bannerEl.innerHTML = `<div class="winner-banner">
            🏆 <strong>${tournamentWinner}</strong> won this tournament
            ${weeklyWinnerTeam ? ` · <span class="badge badge-win">✓ ${weeklyWinnerTeam}</span> took the bonus` : '· No pool participant picked the winner'}
        </div>`;
    } else {
        bannerEl.innerHTML = '<div class="winner-banner" style="color:var(--muted)">⏳ Tournament result not yet recorded</div>';
    }

    // ── Picks table ──
    let t = '<table><thead><tr>';
    t += '<th>Team / Owner</th><th>Golfer Pick</th><th></th>';
    t += '</tr></thead><tbody>';

    bodyRows.forEach(row => {
        const pick  = (row[wIdx + 1] || '').trim();
        const isWin = tournamentWinner && pick &&
                      pick.toLowerCase() === tournamentWinner.toLowerCase();
        t += '<tr>';
        t += `<td class="c-name">${row[0]}</td>`;
        t += `<td>${pick || '<span class="zero">—</span>'}</td>`;
        t += `<td>${isWin ? '<span class="badge badge-win">✓ Winner</span>' : ''}</td>`;
        t += '</tr>';
    });

    t += '</tbody></table>';
    document.getElementById('picks-body').innerHTML = t;
}

// ═══════════════════════════════════════════════════════════
//  WEEKLY WINNERS
//
//  Expected Weekly Winners layout:
//    Row 0  → headers: ["Week", "Tournament", "Winner (Golfer)", "Team That Won", "Prize"]
//    Row 1+ → data, one row per completed week
//
//  Adjust column indices below if your sheet uses a different order.
// ═══════════════════════════════════════════════════════════
function renderWeeklyWinners() {
    const rows = (cache.weeklyWinners || []).filter(r => r.some(Boolean));
    if (rows.length < 2) {
        document.getElementById('winners-body').innerHTML = '<div class="msg">No results recorded yet.</div>';
        return;
    }

    const headers  = rows[0];
    const body     = rows.slice(1).filter(r => r[0]);

    // Count unique winners for stat box
    const teamWins = {};
    body.forEach(r => {
        const team = (r[3] || '').trim(); // Col 3 = team that won
        if (team) teamWins[team] = (teamWins[team] || 0) + 1;
    });
    const topWinner = Object.entries(teamWins).sort((a, b) => b[1] - a[1])[0];
    const totalPaid = body.reduce((s, r) => s + toNum(r[4]), 0); // Col 4 = prize

    document.getElementById('winners-stats').innerHTML = `
        <div class="stat-box"><div class="val">${body.length}</div><div class="lbl">Tournaments Complete</div></div>
        <div class="stat-box gold"><div class="val">${topWinner ? topWinner[0] : '—'}</div><div class="lbl">Most Bonus Wins</div></div>
        <div class="stat-box"><div class="val">$${Math.round(totalPaid).toLocaleString()}</div><div class="lbl">Bonuses Paid</div></div>
    `;

    // Table
    let t = '<table><thead><tr>';
    headers.filter(Boolean).forEach((h, i) => {
        const isRight = i >= 4; // prize column → right-align
        t += `<th${isRight ? ' class="c-right"' : ''}>${h}</th>`;
    });
    t += '</tr></thead><tbody>';

    body.forEach(row => {
        t += '<tr>';
        row.forEach((cell, i) => {
            const isMoney = i >= 4 && toNum(cell) > 0;
            const content = isMoney ? fmtMoney(cell) : (cell || '<span class="zero">—</span>');
            t += `<td${i >= 4 ? ' class="c-right"' : i === 3 ? ' class="c-name"' : ''}>${content}</td>`;
        });
        t += '</tr>';
    });

    t += '</tbody></table>';
    document.getElementById('winners-body').innerHTML = t;
}

// ═══════════════════════════════════════════════════════════
//  POOL INFO
//
//  Reads the Pool Setup tab (key–value pairs) and shows
//  buy-in, payout splits, and the roster of participants.
// ═══════════════════════════════════════════════════════════
function renderInfo() {
    const rows = (cache.setup || []).filter(r => r.some(Boolean));
    const el   = document.getElementById('info-body');

    if (!rows.length) {
        el.innerHTML = '<div class="msg">No pool configuration found.</div>';
        return;
    }

    // Build full table from Pool Setup
    let setupHtml = '<table class="info-kv"><tbody>';
    rows.forEach(row => {
        if (!row[0]) return;
        const key  = row[0];
        const rest = row.slice(1).filter(Boolean).join(' · ');
        const isPayout = /payout|split|prize|winner|bonus/i.test(key);
        setupHtml += `<tr${isPayout ? ' class="payout-row"' : ''}>`;
        setupHtml += `<td>${key}</td><td>${rest || '—'}</td>`;
        setupHtml += '</tr>';
    });
    setupHtml += '</tbody></table>';

    // Participant count from standings if available
    const pCount = cache.standings ? cache.standings.slice(1).filter(r => r[0]).length : null;

    // Stat boxes
    let stats = '';
    if (pCount) stats += `<div class="stat-box"><div class="val">${pCount}</div><div class="lbl">Teams</div></div>`;
    stats += `<div class="stat-box gold"><div class="val">$100</div><div class="lbl">Buy-In Per Team</div></div>`;
    if (pCount) stats += `<div class="stat-box"><div class="val">$${(pCount * 100).toLocaleString()}</div><div class="lbl">Total Pot</div></div>`;

    el.innerHTML = `
        <div class="stat-strip">${stats}</div>

        <div class="card">
            <div class="card-hdr">💰 Pool Configuration</div>
            <div class="card-body">${setupHtml}</div>
        </div>

        <div class="card">
            <div class="card-hdr">📋 How It Works</div>
            <div class="card-body">
                <ol class="how-list">
                    <li>Each team pays a <strong>$100 buy-in</strong> before the season starts.</li>
                    <li>Picks are due <strong>Wednesday 9 PM</strong> before each tournament. Each team selects one pro golfer.</li>
                    <li>You can only use each golfer <strong>once per season</strong> (One and Done).</li>
                    <li>If your golfer wins the tournament, your team earns the <strong>weekly bonus</strong>.</li>
                    <li>Season-long earnings are tracked in Standings via each golfer's <strong>Official Money</strong>.</li>
                    <li>The <strong>Tour Championship</strong> counts toward season totals but pays no weekly bonus.</li>
                    <li>Player names must <strong>exactly match</strong> between Picks and Results (use pgatour.com spelling).</li>
                </ol>
            </div>
        </div>
    `;
}

// ═══════════════════════════════════════════════════════════
//  INIT + REFRESH
// ═══════════════════════════════════════════════════════════
function stamp() {
    document.getElementById('last-updated').textContent =
        'Updated ' + new Date().toLocaleString('en-CA', {
            weekday:'short', month:'short', day:'numeric',
            hour:'2-digit', minute:'2-digit'
        });
}

async function refreshAll() {
    // Clear all caches so next load re-fetches
    Object.keys(cache).forEach(k => delete cache[k]);
    Object.keys(loaded).forEach(k => delete loaded[k]);
    picksRows = null;
    stamp();

    // Re-render the active pane
    const active = document.querySelector('.tab-pane.active');
    const btn    = document.querySelector('.tab-btn.active');
    if (active && btn) {
        const pane = active.id;
        // Reset the active pane content
        const resetMap = {
            standings: ['standings-body', 'standings-stats'],
            picks    : ['picks-body'],
            winners  : ['winners-body', 'winners-stats'],
            info     : ['info-body'],
        };
        (resetMap[pane] || []).forEach(id => {
            const el = document.getElementById(id);
            if (el) el.innerHTML = '<div class="msg"><span class="spinner"></span>Refreshing…</div>';
        });
        await loadAndRender(pane);
    }
}

async function init() {
    stamp();
    // Pre-load standings + weeklyWinners (needed by Picks tab too)
    try {
        await Promise.all([fetchTab('standings'), fetchTab('weeklyWinners')]);
        renderStandings();
        loaded['standings'] = true;
    } catch (e) {
        setErr('standings', e.message);
    }
}

init();
</script>
</body>
</html>
