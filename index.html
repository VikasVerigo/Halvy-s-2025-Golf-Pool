<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halvy &amp; Franco's Golf Pool - 2026</title>
<style>
  :root {
    --green:  #1a5c2e;
    --gold:   #c9a227;
    --light:  #f4f9f4;
    --border: #d0ddd0;
    --text:   #1a1a1a;
    --muted:  #666;
    --row-alt:#eef4ee;
    --win:    #fff8e1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--light); color: var(--text); }

  /* ── Header ── */
  header { background: var(--green); color: #fff; padding: 18px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 1.4rem; font-weight: 700; }
  header span { font-size: 0.9rem; opacity: .75; margin-left: auto; }

  /* ── Tabs ── */
  nav { background: #fff; border-bottom: 2px solid var(--border); display: flex; padding: 0 16px; }
  nav button {
    background: none; border: none; padding: 14px 20px; cursor: pointer;
    font-size: 0.95rem; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent;
    transition: color .2s, border-color .2s;
  }
  nav button.active { color: var(--green); border-bottom-color: var(--gold); }
  nav button:hover { color: var(--green); }

  /* ── Panels ── */
  .panel { display: none; padding: 20px 16px; max-width: 1400px; margin: 0 auto; }
  .panel.active { display: block; }

  /* ── Tables ── */
  .table-wrap { overflow-x: auto; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; font-size: 0.88rem; }
  thead th { background: var(--green); color: #fff; padding: 10px 12px; text-align: left; white-space: nowrap; position: sticky; top: 0; z-index: 2; }
  thead th.num { text-align: right; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: #dff0df; }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody td.zero { color: #bbb; }

  /* ── Frozen columns (Rank + Participant) ── */
  td.col-rank {
    position: sticky; left: 0; z-index: 3;
    background: #fff;
  }
  th.col-rank { position: sticky; left: 0; z-index: 4; min-width: 52px; background: var(--green); }
  td.col-owner {
    position: sticky; left: 52px; z-index: 3;
    background: #fff;
  }
  th.col-owner { position: sticky; left: 52px; z-index: 4; min-width: 150px; background: var(--green); }
  /* Shadow on right edge of frozen area */
  td.col-owner, th.col-owner {
    box-shadow: 3px 0 6px -2px rgba(0,0,0,.15);
  }
  tbody tr:nth-child(even) td.col-rank,
  tbody tr:nth-child(even) td.col-owner { background: var(--row-alt); }
  tbody tr:hover td.col-rank,
  tbody tr:hover td.col-owner { background: #dff0df; }

  /* Rank medal colours */
  .rank-1 { color: #c9a227; font-weight: 700; }
  .rank-2 { color: #888; font-weight: 700; }
  .rank-3 { color: #a0522d; font-weight: 700; }

  /* ── Toggle (payouts) ── */
  .toggle-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .toggle-bar button {
    padding: 8px 18px; border-radius: 20px; border: 2px solid var(--green);
    background: #fff; color: var(--green); cursor: pointer; font-weight: 600; font-size: 0.88rem;
    transition: background .15s, color .15s;
  }
  .toggle-bar button.active { background: var(--green); color: #fff; }

  /* ── Weekly Winners ── */
  .ww-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .ww-card {
    background: #fff; border-radius: 10px; padding: 16px 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); border-left: 5px solid var(--green);
  }
  .ww-card.no-pick { border-left-color: #ccc; }
  .ww-card .wk { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .ww-card .tourney { font-size: 1rem; font-weight: 700; margin: 2px 0 6px; }
  .ww-card .winner-name { color: var(--green); font-weight: 600; }
  .ww-card .bonus { font-size: 0.85rem; color: var(--gold); font-weight: 700; margin-top: 6px; }
  .ww-card .pickers { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
  .ww-card .no-winner-label { font-size: 0.85rem; color: #aaa; font-style: italic; margin-top: 4px; }

  /* ── Sortable headers ── */
  thead th.sortable { cursor: pointer; user-select: none; }
  thead th.sortable:hover { background: #2d7a45; }
  thead th .sort-icon { margin-left: 4px; opacity: .5; font-size: 0.75em; }
  thead th.sort-asc .sort-icon::after { content: ' ▲'; opacity: 1; }
  thead th.sort-desc .sort-icon::after { content: ' ▼'; opacity: 1; }
  thead th:not(.sort-asc):not(.sort-desc) .sort-icon::after { content: ' ⇅'; }

  /* ── Pick+earnings cell ── */
  .pick-cell { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .pick-player { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  .pick-amount { font-variant-numeric: tabular-nums; }
  .pick-amount.zero { color: #bbb; }
  .pick-amount.no-pick { color: #ddd; font-style: italic; }

  /* ── Upcoming badge ── */
  .upcoming { color: #aaa; font-style: italic; }

  /* ── Totals row ── */
  tr.totals-row td { font-weight: 700; background: #e8f5e9; border-top: 2px solid var(--green); }

  /* ── Pool Setup ── */
  .setup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 8px; }
  .setup-card {
    background: #fff; border-radius: 10px; padding: 20px 22px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .setup-card h3 {
    font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
    color: var(--green); margin-bottom: 14px; border-bottom: 2px solid var(--border); padding-bottom: 6px;
  }
  .config-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
  .config-row:last-child { border-bottom: none; }
  .config-label { color: var(--muted); }
  .config-val { font-weight: 600; }
  .payout-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
  .payout-row:last-child { border-bottom: none; }
  .payout-label { color: var(--muted); }
  .payout-amount { font-weight: 700; color: var(--green); font-size: 1rem; }
  .totals-bar {
    background: var(--green); color: #fff; border-radius: 10px; padding: 16px 22px;
    display: flex; gap: 32px; flex-wrap: wrap; margin-bottom: 20px;
  }
  .totals-bar .stat { display: flex; flex-direction: column; gap: 2px; }
  .totals-bar .stat-label { font-size: 0.75rem; opacity: .75; text-transform: uppercase; letter-spacing: .06em; }
  .totals-bar .stat-val { font-size: 1.4rem; font-weight: 700; }
  .status-paid { color: #1a7a3a; font-weight: 700; }
  .status-half { color: #c97a00; font-weight: 700; }
  .status-unpaid { color: #c0392b; font-weight: 700; }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    header h1 { font-size: 1.1rem; }
    nav button { padding: 12px 10px; font-size: 0.82rem; }
    .hide-mob { display: none; }
  }
</style>

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(n) {
  if (!n) return '$0';
  return '$' + n.toLocaleString('en-CA');
}

function rankClass(i) {
  if (i === 0) return 'rank-1';
  if (i === 1) return 'rank-2';
  if (i === 2) return 'rank-3';
  return '';
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function showTab(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

// ── Leaderboard sort state ────────────────────────────────────────────────────
let lbSortCol = '__total__';
let lbSortDir = -1; // -1 = desc, 1 = asc

function sortLeaderboard(col) {
  if (lbSortCol === col) {
    lbSortDir *= -1;
  } else {
    lbSortCol = col;
    lbSortDir = (col === 'owner') ? 1 : -1;
  }
  buildLeaderboard();
}

function sortClass(col) {
  if (lbSortCol !== col) return '';
  return lbSortDir === -1 ? ' sort-desc' : ' sort-asc';
}

// ── Leaderboard ───────────────────────────────────────────────────────────────
function buildLeaderboard() {
  const tbl = document.getElementById('lb-table');
  const tNames = tournaments.map(t => t.name);
  const compSet = new Set(completed);

  // Base list with fixed season-total rank pre-computed
  const base = standings.filter(s => s.owner && s.owner !== '0');
  const rankMap = {};
  base.forEach((s, i) => { rankMap[s.owner] = i + 1; });

  // Sort a copy
  const sorted = [...base];
  sorted.sort((a, b) => {
    if (lbSortCol === '__rank__' || lbSortCol === '__total__') {
      return (b.total - a.total) * lbSortDir;
    } else if (lbSortCol === 'owner') {
      const va = a.owner.toLowerCase(), vb = b.owner.toLowerCase();
      return va < vb ? -lbSortDir : va > vb ? lbSortDir : 0;
    } else {
      return ((b.weekly[lbSortCol] || 0) - (a.weekly[lbSortCol] || 0)) * lbSortDir;
    }
  });

  // Header
  let html = '<thead><tr>';
  html += `<th class="col-rank sortable${sortClass('__rank__')}" onclick="sortLeaderboard('__rank__')">#<span class="sort-icon"></span></th>`;
  html += `<th class="col-owner sortable${sortClass('owner')}" onclick="sortLeaderboard('owner')">Participant<span class="sort-icon"></span></th>`;
  tNames.forEach(t => {
    const done = compSet.has(t);
    const dates = (tournaments.find(x => x.name === t) || {}).dates || '';
    html += `<th class="num sortable${done ? '' : ' upcoming'}${sortClass(t)}" onclick="sortLeaderboard('${t.replace(/'/g, "\'")}')">${t}<br><small>${dates}</small><span class="sort-icon"></span></th>`;
  });
  html += `<th class="num sortable${sortClass('__total__')}" onclick="sortLeaderboard('__total__')">Season Total<span class="sort-icon"></span></th>`;
  html += '</tr></thead><tbody>';

  sorted.forEach(s => {
    const rank = rankMap[s.owner];
    const rc = rankClass(rank - 1);
    html += `<tr>`;
    html += `<td class="col-rank ${rc}">${rank}</td>`;
    html += `<td class="col-owner">${s.owner}</td>`;
    tNames.forEach(t => {
      const v = s.weekly[t] || 0;
      const player = (picks[s.owner] || {})[t] || '';
      if (!compSet.has(t)) {
        html += `<td class="num"><div class="pick-cell"><span class="pick-player">${player || '—'}</span></div></td>`;
      } else {
        const amtCls = v === 0 ? 'zero' : '';
        html += `<td class="num"><div class="pick-cell"><span class="pick-player">${player || '—'}</span><span class="pick-amount ${amtCls}">${v ? fmt(v) : (player ? '$0' : '—')}</span></div></td>`;
      }
    });
    html += `<td class="num" style="font-weight:700">${fmt(s.total)}</td></tr>`;
  });

  html += '</tbody>';
  tbl.innerHTML = html;
}

// ── Payouts ───────────────────────────────────────────────────────────────────
let payoutView = 'week';

function setPayoutView(v) {
  payoutView = v;
  document.getElementById('btn-by-week').classList.toggle('active', v === 'week');
  document.getElementById('btn-by-player').classList.toggle('active', v === 'player');
  buildPayouts();
}

function buildPayouts() {
  const tbl = document.getElementById('payout-table');
  const compTourneys = tournaments.filter(t => completed.includes(t.name));

  if (payoutView === 'week') {
    // Rows = participants, columns = completed tournaments
    let html = '<thead><tr><th>Participant</th>';
    compTourneys.forEach(t => {
      html += `<th class="num">${t.name}<br><small>${t.dates}</small></th>`;
    });
    html += '<th class="num">Total</th></tr></thead><tbody>';

    const owners = Object.keys(picks).sort();
    owners.forEach(owner => {
      html += `<tr><td>${owner}</td>`;
      let rowTotal = 0;
      compTourneys.forEach(t => {
        const player = (picks[owner] || {})[t.name] || '';
        const earnings = (results[t.name] || {})[player] || 0;
        rowTotal += earnings;
        const cls = earnings === 0 ? 'num zero' : 'num';
        const label = earnings ? fmt(earnings) : (player ? `<span style="color:#aaa;font-style:italic">${player}</span>` : '—');
        html += `<td class="${cls}" title="${player}">${label}</td>`;
      });
      html += `<td class="num" style="font-weight:700">${fmt(rowTotal)}</td></tr>`;
    });
    html += '</tbody>';
    tbl.innerHTML = html;

  } else {
    // Rows = PGA players picked, columns = participants who picked them
    // Build: player → {tournament, owner, earnings}
    const playerMap = {};  // player -> array of pick objects
    const owners = Object.keys(picks).sort();

    compTourneys.forEach(t => {
      const res = results[t.name] || {};
      owners.forEach(owner => {
        const player = (picks[owner] || {})[t.name] || '';
        if (!player) return;
        if (!playerMap[player]) playerMap[player] = [];
        const earnings = res[player] || 0;
        playerMap[player].push({ owner: owner, tournament: t.name, earnings: earnings });
      });
    });

    // Sort players by total earnings desc
    const playerList = Object.keys(playerMap).sort((a, b) => {
      const ta = playerMap[a].reduce((s, x) => s + x.earnings, 0);
      const tb = playerMap[b].reduce((s, x) => s + x.earnings, 0);
      return tb - ta;
    });

    let html = '<thead><tr><th>PGA Player</th><th>Tournament</th><th>Earnings</th><th>Picked By</th></tr></thead><tbody>';
    playerList.forEach(player => {
      const entries = playerMap[player];
      // Group by tournament
      const byTourney = {};
      entries.forEach(e => {
        if (!byTourney[e.tournament]) byTourney[e.tournament] = { earnings: e.earnings, owners: [] };
        byTourney[e.tournament].owners.push(e.owner);
      });

      const tourneys = Object.keys(byTourney);
      tourneys.forEach((tourney, ti) => {
        const {earnings, owners: ow} = byTourney[tourney];
        const cls = earnings === 0 ? 'zero' : '';
        html += `<tr>`;
        if (ti === 0) html += `<td rowspan="${tourneys.length}" style="font-weight:600">${player}</td>`;
        html += `<td>${tourney}</td>`;
        html += `<td class="num ${cls}">${earnings ? fmt(earnings) : '—'}</td>`;
        html += `<td>${ow.join(', ')}</td></tr>`;
      });
    });
    html += '</tbody>';
    tbl.innerHTML = html;
  }
}

// ── Weekly Winners ────────────────────────────────────────────────────────────
function buildWeeklyWinners() {
  const grid = document.getElementById('ww-grid');
  let html = '';

  weeklyWinners.forEach(w => {
    const hasWinner = w.winner && w.winner !== '0';
    const hasPickers = w.pickers && w.pickers.length > 0;
    const isUpcoming = !hasWinner;
    const noPickBonus = w.bonus === 'No Winner Picked' || w.bonus === 'N/A — No Weekly Payout';

    let bonusText = '';
    if (noPickBonus) {
      bonusText = `<div class="no-winner-label">${w.bonus}</div>`;
    } else if (typeof w.bonus === 'number' && w.bonus > 0) {
      const bonusAmt = '$' + w.bonus.toLocaleString('en-CA', {minimumFractionDigits: 2, maximumFractionDigits: 2});
      bonusText = `<div class="bonus">Pool Bonus: ${bonusAmt} / person</div>`;
    }

    let pickerText = '';
    if (hasPickers) {
      pickerText = `<div class="pickers">🎉 ${w.pickers.join(', ')}</div>`;
    }

    const cardClass = (!hasWinner || !hasPickers) ? 'ww-card no-pick' : 'ww-card';

    html += `
    <div class="${cardClass}">
      <div class="wk">Week ${w.week} · ${w.dates}</div>
      <div class="tourney">${w.tournament}</div>
      ${hasWinner
        ? `<div class="winner-name">🏆 ${w.winner}</div>${bonusText}${pickerText}`
        : `<div class="no-winner-label">Upcoming / No result yet</div>`
      }
    </div>`;
  });

  grid.innerHTML = html;
}

// ── Pool Setup ────────────────────────────────────────────────────────────────
function buildPoolSetup() {
  const el = document.getElementById('pool-setup-content');
  const s = poolSetup;
  const t = s.totals;

  // Totals bar
  const paidCount  = s.entries.filter(e => e.status === 'PAID').length;
  const halfCount  = s.entries.filter(e => e.status === '½ PAID').length;
  const collected  = t.collected || 0;
  const poolSize   = t.pool_size || 0;

  let html = `
  <div class="totals-bar">
    <div class="stat"><span class="stat-label">Participants</span><span class="stat-val">${t.entries || 0}</span></div>
    <div class="stat"><span class="stat-label">Total Pool</span><span class="stat-val">$${poolSize.toLocaleString('en-CA')}</span></div>
    <div class="stat"><span class="stat-label">Collected</span><span class="stat-val">$${collected.toLocaleString('en-CA')}</span></div>
    <div class="stat"><span class="stat-label">Fully Paid</span><span class="stat-val">${paidCount}</span></div>
    <div class="stat"><span class="stat-label">½ Paid</span><span class="stat-val">${halfCount}</span></div>
  </div>
  <div class="setup-grid">`;

  // Card 1: Pool Rules
  html += `<div class="setup-card"><h3>Pool Rules</h3>`;
  Object.entries(s.config).forEach(([k, v]) => {
    html += `<div class="config-row"><span class="config-label">${k}</span><span class="config-val">${v}</span></div>`;
  });
  html += `</div>`;

  // Card 2: Payout Breakdown
  html += `<div class="setup-card"><h3>Payout Breakdown ($${poolSize.toLocaleString('en-CA')} pool)</h3>`;
  s.payouts.forEach(p => {
    const amt = typeof p.amount === 'number' ? fmt(p.amount) : p.amount;
    html += `<div class="payout-row"><span class="payout-label">${p.label}</span><span class="payout-amount">${amt}</span></div>`;
  });
  html += `</div>`;

  html += `</div>`; // close setup-grid

  // Participants table
  html += `
  <div class="table-wrap" style="margin-top:20px">
  <table>
    <thead><tr>
      <th>#</th><th>Participant</th>
      <th class="num">Payment 1<br><small>$100</small></th>
      <th class="num">Payment 2<br><small>$100</small></th>
      <th>Status</th>
    </tr></thead>
    <tbody>`;

  s.entries.forEach(e => {
    const sc = e.status === 'PAID' ? 'status-paid' : e.status === '½ PAID' ? 'status-half' : 'status-unpaid';
    const p1 = e.pay1 ? `<span style="color:#1a7a3a">${e.pay1}</span>` : '<span style="color:#bbb">—</span>';
    const p2 = e.pay2 ? `<span style="color:#1a7a3a">${e.pay2}</span>` : '<span style="color:#bbb">—</span>';
    html += `<tr>
      <td>${e.num}</td>
      <td>${e.name}</td>
      <td class="num">${p1}</td>
      <td class="num">${p2}</td>
      <td><span class="${sc}">${e.status}</span></td>
    </tr>`;
  });

  html += `</tbody></table></div>`;
  el.innerHTML = html;
}
